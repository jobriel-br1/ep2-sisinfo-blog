{% extends 'base.html' %}

{% block content %}
    <h1>{% if post %}Editar Post{% else %}Novo Post{% endif %}</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar</button>
        <a href="{% url 'post_list' %}">Cancelar</a>
    </form>
{% endblock %}
