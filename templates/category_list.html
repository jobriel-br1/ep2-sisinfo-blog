{% extends 'base.html' %}

{% block content %}
    <h1>Categorias</h1>
    {% for category in categories %}
        <article class="card">
            <h2 style="margin-bottom: 0.4rem;">
                <a href="{% url 'category_detail' category.pk %}" style="text-decoration: none;">{{ category.name }}</a>
            </h2>
            <p style="margin: 0; color: #475569;">{{ category.description }}</p>
        </article>
    {% empty %}
        <article class="card">
            <p style="margin: 0;">Nenhuma categoria cadastrada.</p>
        </article>
    {% endfor %}
{% endblock %}
